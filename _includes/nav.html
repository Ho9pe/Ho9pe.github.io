{%- assign here = page.url -%}
<header class="site-header">
  <div class="wrap header-inner">
    <a class="brand" href="{{ '/' | relative_url }}"><span class="prompt">~/</span>asif<span class="cursor">_</span></a>
    <nav class="site-nav" aria-label="Main">
      <a href="{{ '/research/' | relative_url }}" {% if here contains '/research' %}aria-current="page"{% endif %}>Research</a>
      <a href="{{ '/projects/' | relative_url }}" {% if here contains '/projects' %}aria-current="page"{% endif %}>Projects</a>
      <a href="{{ '/ctf/' | relative_url }}" {% if here contains '/ctf' %}aria-current="page"{% endif %}>CTF</a>
      <a href="{{ '/blog/' | relative_url }}" {% if here contains '/blog' %}aria-current="page"{% endif %}>Blog</a>
      <a href="{{ site.cv_pdf | relative_url }}">CV</a>
      <button class="theme-toggle" type="button" aria-label="Toggle dark mode" title="Toggle dark mode">
        <svg class="icon-sun" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="12" cy="12" r="4.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <svg class="icon-moon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
      </button>
    </nav>
  </div>
</header>
